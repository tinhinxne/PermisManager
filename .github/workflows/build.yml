name: Build PermisManager

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Build
        run: npm run make

      - name: Upload des fichiers générés
        uses: actions/upload-artifact@v4
        with:
          name: permismanager-${{ matrix.os }}
          path: out/make/**
